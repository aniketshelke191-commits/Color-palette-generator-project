<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <h1>Color Palette Generator</h1>

      <button id="generate-btn">
        <i class="fas fa-sync-alt"></i>
        Generate Palette
      </button>

      <div class="palette-container">
        <!--Color Box 1-->
        <div class="color-box">
          <div class="color" style="background-color: green"></div>
          <div class="color-info">
            <span class="hex-value">#2244fd</span>
            <i class="far fa-copy copy-btn"></i>
          </div>
        </div>

        <!-- Color Box 2 -->
        <div class="color-box">
          <div class="color" style="background-color: rgb(11, 67, 249)"></div>
          <div class="color-info">
            <span class="hex-value">#53444fd</span>
            <i class="far fa-copy copy-btn"></i>
          </div>
        </div>

        <!-- Color Box 3 -->
        <div class="color-box">
          <div class="color" style="background-color: rgb(14, 165, 235)"></div>
          <div class="color-info">
            <span class="hex-value">#56454fd</span>
            <i class="far fa-copy copy-btn"></i>
          </div>
        </div>

        <!-- Color Box 4 -->
        <div class="color-box">
          <div class="color" style="background-color: rgb(220, 0, 254)"></div>
          <div class="color-info">
            <span class="hex-value">#ffre4fd</span>
            <i class="far fa-copy copy-btn"></i>
          </div>
        </div>

        <!-- Color Box 5 -->
        <div class="color-box">
          <div class="color" style="background-color: rgb(241, 51, 22)"></div>
          <div class="color-info">
            <span class="hex-value">#fcgc44fd</span>
            <i class="far fa-copy copy-btn"></i>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
